name: dotnet-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore FormSqlTranslator.sln

      - name: Build
        run: dotnet build FormSqlTranslator.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FormSqlTranslator.sln --configuration Release --no-build
